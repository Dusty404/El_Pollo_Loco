<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="img/4_enemie_boss_chicken/2_alert/G10.png"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="models/drawableObject.class.js"></script>
    <script src="models/statusbar.class.js"></script>
    <script src="statusbars/statusbar-HP.js"></script>
    <script src="statusbars/statusbar-Coin.js"></script>
    <script src="statusbars/statusbar-Bottle.js"></script>
    <script src="statusbars/statusbar-BossHP.js"></script>
    <script src="models/moveable-object.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chickenSmall.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/lvl.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/throwableObject.class.js"></script>
    <script src="models/collectableObject.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
  </head>
  <body>
    <h1>El Pollo Loco</h1>

    <canvas id="canvas" width="720" height="480"></canvas>
    <div id="menuOverlay" class="menuOverlay backgroundImage">
      <div class="optionButtonsRow">
        <butto id="muteSound" class="optionButton"><img src="img/optionButtons/volume-high-solid.svg"></butto>
        <butto id="muteMusic" class="optionButton"><img src="img/optionButtons/music-solid.svg"></butto>
        <butto id="fullscreen" class="optionButton" onclick="fullscreenOption()"><img src="img/optionButtons/expand-solid.svg"></butto>
      </div>
      <button id="startGame" onclick="init()" class="startGameButton">
        Start Game
      </button>
      <div id="mobileControlles" class="mobileControlles d-none">
        <butto id="mobileRunLeft" class="mobileControlleButton runLeft"></butto>
        <button
          id="mobileJump"
          class="mobileControlleButton jumpButton"
        ></button>
        <button
          id="mobileThrowBottle"
          class="mobileControlleButton throwBottleButton"
        ></button>
        <butto
          id="mobileRunRigth"
          class="mobileControlleButton runRight"
        ></butto>
      </div>
    </div>
  </body>
</html>
